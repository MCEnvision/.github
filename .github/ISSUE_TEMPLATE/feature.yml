name: workflow improvement
description: propose a reusable validation or automation improvement
title: "[feature] "
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: problem
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: proposed behavior
      description: include caller impact, compatibility, security boundaries, and acceptance criteria
    validations:
      required: true
