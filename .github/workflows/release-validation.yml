name: shared release validation

on:
  workflow_call:
    inputs:
      shared-ref:
        required: false
        type: string
        default: "main"
      java-version:
        required: false
        type: string
        default: "21"
      gradle-enabled:
        required: false
        type: boolean
        default: true
      gradle-tasks:
        required: false
        type: string
        default: "clean build"
      artifact-glob:
        required: false
        type: string
        default: "build/libs/*.jar"
      sbom-path:
        required: false
        type: string
        default: "build/libs"
      environment:
        required: false
        type: string
        default: "production"
      attest:
        required: false
        type: boolean
        default: true

jobs:
  validate-release:
    name: release validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check out shared validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MCEnvision/.github
          ref: ${{ inputs.shared-ref }}
          path: .github-central
      - name: Set up Java
        if: ${{ inputs.gradle-enabled }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - name: Set up and validate Gradle
        if: ${{ inputs.gradle-enabled }}
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Build release artifacts
        if: ${{ inputs.gradle-enabled }}
        env:
          GRADLE_TASKS: ${{ inputs.gradle-tasks }}
        run: python .github-central/scripts/run_gradle.py --tasks "$GRADLE_TASKS"
      - name: Validate artifacts and create checksums
        env:
          ARTIFACT_GLOB: ${{ inputs.artifact-glob }}
        run: >-
          python .github-central/scripts/check_release.py
          --artifact-glob "$ARTIFACT_GLOB"
          --output-directory release-validation
      - name: Verify signed annotated release tag
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github-central/scripts/verify_release_tag.py
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ inputs.sbom-path }}
          format: spdx-json
          output-file: release-validation/release.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Attest release artifacts
        if: ${{ inputs.attest && github.event.repository.visibility == 'public' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ inputs.artifact-glob }}
      - name: Attest release SBOM
        if: ${{ inputs.attest && github.event.repository.visibility == 'public' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ inputs.artifact-glob }}
          sbom-path: release-validation/release.spdx.json
      - name: Verify release attestations
        if: ${{ inputs.attest && github.event.repository.visibility == 'public' }}
        env:
          ARTIFACT_GLOB: ${{ inputs.artifact-glob }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .github-central/scripts/verify_attestations.py
          --artifact-glob "$ARTIFACT_GLOB"
          --repository "$GITHUB_REPOSITORY"
          --signer-repository "MCEnvision/.github"
          --signer-workflow "MCEnvision/.github/.github/workflows/release-validation.yml"
      - name: Retain validated release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-release-${{ github.sha }}
          path: |
            ${{ inputs.artifact-glob }}
            release-validation/**
          if-no-files-found: error
          retention-days: 30
