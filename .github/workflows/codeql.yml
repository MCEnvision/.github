name: shared codeql

on:
  workflow_call:
    inputs:
      shared-ref:
        required: false
        type: string
        default: "main"
      java-version:
        required: false
        type: string
        default: "21"
      gradle-enabled:
        required: false
        type: boolean
        default: false
      gradle-tasks:
        required: false
        type: string
        default: "check build"
      languages:
        required: true
        type: string
      neoforge-enabled:
        required: false
        type: boolean
        default: false

jobs:
  analyze:
    name: codeql, ${{ matrix.language }}
    if: ${{ inputs.languages != '[]' && github.actor != 'dependabot[bot]' }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out shared validation
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MCEnvision/.github
          ref: ${{ inputs.shared-ref }}
          path: .github-central
      - name: Set up Java
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - name: Set up Gradle
        if: ${{ matrix.language == 'java-kotlin' && inputs.gradle-enabled }}
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
          queries: >-
            ${{
              matrix.language == 'java-kotlin' && inputs.neoforge-enabled &&
              'security-extended,./.github-central/codeql/neoforge/neoforge-security.qls' ||
              'security-extended'
            }}
      - name: Build Java for CodeQL
        if: ${{ matrix.language == 'java-kotlin' && inputs.gradle-enabled }}
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.compiler.execution.strategy=in-process
          GRADLE_TASKS: ${{ inputs.gradle-tasks }}
        run: python .github-central/scripts/run_gradle.py --tasks "$GRADLE_TASKS" --force-execution
      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
