name: quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validation-scripts:
    name: validation scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m compileall -q scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_workflow_policy.py --root .

  codeql-query-pack:
    name: codeql query pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up CodeQL CLI
        id: setup
        uses: github/codeql-action/setup-codeql@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: java-kotlin
      - name: Install query pack dependencies
        env:
          CODEQL: ${{ steps.setup.outputs.codeql-path }}
        run: '"$CODEQL" pack install -- codeql/neoforge'
      - name: Compile custom queries
        env:
          CODEQL: ${{ steps.setup.outputs.codeql-path }}
        run: '"$CODEQL" query compile --check-only --keep-going -- codeql/neoforge'

  quality:
    uses: ./.github/workflows/quality.yml
    with:
      enforce-docs-layout: true
      native-security: true

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: '["actions","python"]'
