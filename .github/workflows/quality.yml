name: shared quality

on:
  workflow_call:
    inputs:
      shared-ref:
        description: Immutable MCEnvision/.github commit used for validation scripts.
        required: false
        type: string
        default: "main"
      java-version:
        description: Java toolchain used for Gradle and Java CodeQL builds.
        required: false
        type: string
        default: "21"
      gradle-enabled:
        description: Run Gradle verification and dependency submission.
        required: false
        type: boolean
        default: false
      gradle-tasks:
        description: Space-separated Gradle verification tasks.
        required: false
        type: string
        default: "check build"
      gametest-tasks:
        description: Space-separated GameTest tasks. Leave empty when unavailable.
        required: false
        type: string
        default: ""
      node-enabled:
        description: Run locked Node.js checks.
        required: false
        type: boolean
        default: false
      node-version:
        description: Node.js version used by Node repositories.
        required: false
        type: string
        default: "22"
      node-working-directory:
        description: Directory containing package.json and the supported lockfile.
        required: false
        type: string
        default: "."
      native-security:
        description: Enable dependency review only when GitHub supports it.
        required: false
        type: boolean
        default: false
      enforce-docs-layout:
        description: Require README.md and the standard docs tree.
        required: false
        type: boolean
        default: true
      denied-packages:
        description: Comma-separated dependency patterns prohibited in pull requests.
        required: false
        type: string
        default: ""

jobs:
  documentation:
    name: documentation
    if: inputs.enforce-docs-layout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check out shared validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MCEnvision/.github
          ref: ${{ inputs.shared-ref }}
          path: .github-central
      - name: Validate documentation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          ENFORCE_LAYOUT: ${{ inputs.enforce-docs-layout }}
        run: |
          args=(--root . --base-sha "$BASE_SHA")
          if [[ "$ENFORCE_LAYOUT" == "true" ]]; then
            args+=(--enforce-layout)
          fi
          python .github-central/scripts/check_documentation.py "${args[@]}"

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan credentials
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          version: 3.96.0
          extra_args: --results=verified,unknown

  gradle:
    name: gradle
    if: ${{ inputs.gradle-enabled }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out shared validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MCEnvision/.github
          ref: ${{ inputs.shared-ref }}
          path: .github-central
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Run Gradle verification
        env:
          GRADLE_TASKS: ${{ inputs.gradle-tasks }}
        run: python .github-central/scripts/run_gradle.py --tasks "$GRADLE_TASKS"
      - name: Run GameTests
        if: ${{ inputs.gametest-tasks != '' }}
        env:
          GAMETEST_TASKS: ${{ inputs.gametest-tasks }}
        run: python .github-central/scripts/run_gradle.py --tasks "$GAMETEST_TASKS"
      - name: Retain test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-test-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  node:
    name: node
    if: ${{ inputs.node-enabled }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out shared validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MCEnvision/.github
          ref: ${{ inputs.shared-ref }}
          path: .github-central
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Enable locked package managers
        run: corepack enable
      - name: Run Node.js checks
        working-directory: ${{ inputs.node-working-directory }}
        run: python "${{ github.workspace }}/.github-central/scripts/run_node_checks.py"

  dependency-review:
    name: dependency review
    if: >-
      ${{
        inputs.native-security &&
        github.event_name == 'pull_request' &&
        github.actor != 'dependabot[bot]'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-packages: ${{ inputs.denied-packages }}
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 180
